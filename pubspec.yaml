name: prf_design
description: PRF Design System - Shared widgets, theme system, and essential utilities.
version: "0.8.3"
repository: https://github.com/PARKROAD-FELLOWSHIP/stunning-fiesta
homepage: https://parkroadfellowship.org
issue_tracker: https://github.com/PARKROAD-FELLOWSHIP/stunning-fiesta/issues

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.38.5"

dependencies:
  flutter:
    sdk: flutter
  flutter_adaptive_ui: ^0.8.0+1
  flutter_animate: ^4.5.2
  flutter_staggered_grid_view: ^0.7.0
  flutter_svg: ^2.3.0
  google_fonts: ^8.1.0
  http: ^1.6.0
  intl: ^0.20.2
  pdfx: ^2.9.2
  phone_form_field: ^10.0.17
  timezone: ^0.11.0

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  assets:
    - assets/authentication/
    - assets/google_fonts/lato/
    - assets/google_fonts/manrope/
