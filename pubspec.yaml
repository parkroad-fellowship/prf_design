name: prf_design
description: PRF Design System - Shared widgets, theme system, and essential utilities.
version: "1.0.1"
repository: https://github.com/parkroad-fellowship/prf_design
homepage: https://parkroadfellowship.org
issue_tracker: https://github.com/parkroad-fellowship/prf_design/issues

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.38.5"

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_staggered_grid_view: ^0.7.0
  flutter_svg: ^2.3.0
  intl: ^0.20.2
  pdfx: ^2.9.2
  phone_form_field: ^10.0.18
  timezone: ^0.11.1

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/google_fonts/manrope/Manrope-ExtraLight.ttf
          weight: 200
        - asset: assets/google_fonts/manrope/Manrope-Light.ttf
          weight: 300
        - asset: assets/google_fonts/manrope/Manrope-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/manrope/Manrope-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/manrope/Manrope-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/manrope/Manrope-ExtraBold.ttf
          weight: 800
    - family: Lato
      fonts:
        - asset: assets/google_fonts/lato/Lato-Thin.ttf
          weight: 100
        - asset: assets/google_fonts/lato/Lato-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/google_fonts/lato/Lato-Light.ttf
          weight: 300
        - asset: assets/google_fonts/lato/Lato-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/google_fonts/lato/Lato-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/lato/Lato-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/google_fonts/lato/Lato-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/lato/Lato-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/google_fonts/lato/Lato-Black.ttf
          weight: 900
        - asset: assets/google_fonts/lato/Lato-BlackItalic.ttf
          weight: 900
          style: italic
  assets:
    - assets/authentication/
    - assets/google_fonts/manrope/OFL.txt
    - assets/google_fonts/lato/OFL.txt
