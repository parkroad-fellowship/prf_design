name: prf_design
description: PRF Design System - Shared widgets, theme system, and essential utilities.
version: "1.1.0"
repository: https://github.com/parkroad-fellowship/prf_design
homepage: https://parkroadfellowship.org
issue_tracker: https://github.com/parkroad-fellowship/prf_design/issues

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_staggered_grid_view: ^0.7.0
  flutter_svg: ^2.3.0
  intl: ^0.20.3
  pdfx: ^2.11.0
  phone_form_field: ">=10.0.18 <13.0.0"
  timezone: ^0.11.2

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/google_fonts/manrope/Manrope-ExtraLight.ttf
          weight: 200
        - asset: assets/google_fonts/manrope/Manrope-Light.ttf
          weight: 300
        - asset: assets/google_fonts/manrope/Manrope-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/manrope/Manrope-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/manrope/Manrope-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/manrope/Manrope-ExtraBold.ttf
          weight: 800
  assets:
    - assets/authentication/
    - assets/google_fonts/manrope/OFL.txt
